<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест термопринтера</title>
<style>
:root{
  --bg:#f4f4f6; --card:#ffffff; --text:#1d1d22; --muted:#6b6b76; --accent:#2f6fdf; --accent-text:#fff;
  --ok:#1f8a4c; --err:#c0392b; --line:#e2e2e8; --log:#f7f7fa;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1b1f; --card:#26262c; --text:#ececf1; --muted:#9a9aa6; --accent:#4f8cf7;
         --line:#36363e; --log:#1f1f24; --ok:#4cc27e; --err:#ff7b6b; }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:4px 0 0;font-size:1.6rem}
p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
button{appearance:none;border:0;border-radius:999px;padding:16px 20px;font-family:inherit;font-weight:600;font-size:1.15rem;line-height:1.2;
  background:var(--accent);color:var(--accent-text);cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.55}
#status{font-weight:600}
#status.ok{color:var(--ok)} #status.err{color:var(--err)}
canvas{display:block;margin:0 auto;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.25);
  width:100%;max-width:384px;image-rendering:pixelated}
#log{margin:0;background:var(--log);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;max-height:40vh;overflow:auto}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.small{font-size:.85rem}
.ghost{background:transparent;color:var(--accent);padding:8px 10px;font-size:.95rem}
</style>
</head>
<body>
<main>
  <div>
    <h1>Тест термопринтера</h1>
    <p>Печатает «Привет!» через Bluetooth (BLE). Включите принтер и отключите его от других телефонов и ноутбука.</p>
  </div>

  <div class="card">
    <canvas id="preview" width="384" height="10" aria-label="Что будет напечатано"></canvas>
    <button id="printBtn" type="button">Напечатать «Привет!»</button>
    <div id="status">Готово к печати</div>
  </div>

  <div class="card">
    <div class="row"><strong>Журнал</strong><button id="copyBtn" class="ghost" type="button">Скопировать</button></div>
    <pre id="log"></pre>
    <p class="small">Если не напечатало, скопируйте журнал и пришлите его.</p>
  </div>
</main>

<script>
'use strict';
const WIDTH = 384;                       // 58 mm paper = 384 dots
// BLE services cheap printers use for "send bytes to the printer"
const SERVICES = [
  '49535343-fe7d-4ae5-8fa9-9fafd205e455',   // ISSC transparent UART (YHK-6322 advertises it)
  '000018f0-0000-1000-8000-00805f9b34fb',   // common ESC/POS printers
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2',   // another common printer service
  '0000ff00-0000-1000-8000-00805f9b34fb',
  '0000ffe0-0000-1000-8000-00805f9b34fb',   // HM-10 style serial
  '0000ae30-0000-1000-8000-00805f9b34fb',   // "cat" printers
  '0000fee7-0000-1000-8000-00805f9b34fb',
];
const PREFERRED_CHAR = '49535343-8841-43f4-a8d4-ecbe34729bb3';  // ISSC: write here

const $ = id => document.getElementById(id);
const logEl = $('log'), statusEl = $('status'), btn = $('printBtn');
function log(msg) {
  const t = new Date().toLocaleTimeString('ru-RU');
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}
function status(msg, kind) { statusEl.textContent = msg; statusEl.className = kind || ''; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- picture -> printer commands ---------- */
function renderHello() {
  const c = $('preview'), g = c.getContext('2d');
  c.height = 110;
  g.fillStyle = '#fff'; g.fillRect(0, 0, WIDTH, c.height);
  g.fillStyle = '#000'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold 64px -apple-system, "Segoe UI", Roboto, sans-serif';
  g.fillText('Привет!', WIDTH / 2, c.height / 2 + 2);
  // make it pure black and white, exactly as it will print
  const img = g.getImageData(0, 0, WIDTH, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (d[i] + d[i + 1] + d[i + 2]) / 3 < 160 ? 0 : 255;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return img;
}
function encode(img) {
  // ESC @ (reset) + GS v 0 raster + 3 line feeds: the same commands that work over the laptop
  const wb = Math.ceil(img.width / 8), h = img.height;
  const out = new Uint8Array(2 + 8 + wb * h + 3);
  let p = 0;
  out[p++] = 0x1B; out[p++] = 0x40;
  out.set([0x1D, 0x76, 0x30, 0x00, wb & 255, wb >> 8, h & 255, h >> 8], p); p += 8;
  for (let y = 0; y < h; y++)
    for (let bx = 0; bx < wb; bx++) {
      let byte = 0;
      for (let bit = 0; bit < 8; bit++) {
        const x = bx * 8 + bit;
        if (x < img.width && img.data[(y * img.width + x) * 4] === 0) byte |= 0x80 >> bit;
      }
      out[p++] = byte;
    }
  out[p++] = 10; out[p++] = 10; out[p++] = 10;
  return out;
}

/* ---------- Bluetooth ---------- */
let device = null, writer = null;

async function findWriter(server) {
  const services = await server.getPrimaryServices();
  log('Сервисы: ' + (services.map(s => s.uuid).join(', ') || 'нет'));
  let best = null;
  for (const s of services) {
    let chars = [];
    try { chars = await s.getCharacteristics(); } catch (e) { log(`  ${s.uuid}: ${e.message}`); continue; }
    for (const ch of chars) {
      const pr = ch.properties;
      const flags = ['write', 'writeWithoutResponse', 'notify', 'read'].filter(k => pr[k]).join(' ');
      log(`  ${s.uuid.slice(0, 8)} → ${ch.uuid}  [${flags}]`);
      if (!(pr.write || pr.writeWithoutResponse)) continue;
      if (ch.uuid === PREFERRED_CHAR) best = ch;
      else if (!best) best = ch;
    }
  }
  return best;
}

async function connect() {
  if (device && device.gatt.connected && writer) return;
  if (!device) {
    status('Выберите принтер в списке…');
    device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: SERVICES });
    log('Устройство: ' + (device.name || '(без имени)') + ' id=' + device.id);
    device.addEventListener('gattserverdisconnected', () => { log('Принтер отключился'); writer = null; });
  }
  status('Подключаюсь…');
  const server = await device.gatt.connect();
  log('Подключено');
  writer = await findWriter(server);
  if (!writer) throw new Error('У устройства нет характеристики для записи. Это точно принтер?');
  log('Пишу в ' + writer.uuid + (writer.properties.writeWithoutResponse ? ' (без подтверждения)' : ' (с подтверждением)'));
}

async function send(data) {
  // BLE takes small packets; start big, fall back to 20 bytes if the phone refuses
  let chunk = 180;
  const fast = writer.properties.writeWithoutResponse && writer.writeValueWithoutResponse;
  for (let i = 0; i < data.length;) {
    const part = data.slice(i, i + chunk);
    try {
      if (fast) { await writer.writeValueWithoutResponse(part); await sleep(12); }
      else if (writer.writeValueWithResponse) await writer.writeValueWithResponse(part);
      else await writer.writeValue(part);
    } catch (e) {
      if (chunk > 20) { log(`Порция ${chunk} байт не прошла (${e.message}), пробую по 20`); chunk = 20; continue; }
      throw e;
    }
    i += part.length;
    status(`Печать… ${Math.round(100 * i / data.length)}%`);
  }
}

btn.addEventListener('click', async () => {
  if (!navigator.bluetooth) {
    status('Этот браузер не умеет Bluetooth', 'err');
    log('navigator.bluetooth нет. iPhone: откройте страницу в Bluefy. Android: в Chrome. Адрес должен начинаться с https://');
    return;
  }
  btn.disabled = true;
  try {
    const data = encode(renderHello());
    log(`Данные: ${data.length} байт`);
    await connect();
    await send(data);
    status('Отправлено. Напечаталось?', 'ok');
    log('Отправлено');
  } catch (e) {
    const cancelled = e && e.name === 'NotFoundError';
    status(cancelled ? 'Принтер не выбран' : 'Ошибка: ' + e.message, cancelled ? '' : 'err');
    log('Ошибка: ' + (e && e.name) + ': ' + (e && e.message));
  } finally {
    btn.disabled = false;
  }
});

$('copyBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(logEl.textContent); $('copyBtn').textContent = 'Скопировано'; }
  catch (_) { const r = document.createRange(); r.selectNodeContents(logEl); getSelection().removeAllRanges(); getSelection().addRange(r); }
  setTimeout(() => { $('copyBtn').textContent = 'Скопировать'; }, 1500);
});

renderHello();
log('Браузер: ' + navigator.userAgent);
log('Web Bluetooth: ' + (navigator.bluetooth ? 'есть' : 'нет'));
</script>
</body>
</html>
